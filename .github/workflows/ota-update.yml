name: Publicar actualización OTA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal: preview (APK de pruebas) o production (APK de la release)'
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      action:
        description: 'publicar: sube el JS de esta rama. volver-al-apk: deshace las OTA y deja el código que trae el APK.'
        required: true
        type: choice
        options:
          - publicar
          - volver-al-apk
        default: publicar
      message:
        description: 'Qué cambia, en una frase'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ota-update
  cancel-in-progress: false

jobs:
  publish:
    name: OTA ${{ inputs.action }} en ${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_MARKET_PRICES_URL: https://surtivox-market.surtivox.workers.dev/market-prices
      CHANNEL: ${{ inputs.channel }}
      ACTION: ${{ inputs.action }}
      MESSAGE: ${{ inputs.message }}

    steps:
      - name: Revisar los requisitos
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Falta el secreto EXPO_TOKEN en GitHub Actions (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "${CHANNEL}" = "production" ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Las OTA de production solo salen de main (esta corrida es de ${GITHUB_REF})."
            exit 1
          fi
          if [ -z "${MESSAGE// /}" ]; then
            echo "::error::Escribe en una frase qué cambia."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos y tests
        if: inputs.action == 'publicar'
        run: |
          bash scripts/verify.sh
          pnpm -r typecheck
          pnpm test

      - name: Check Expo SDK alignment
        if: inputs.action == 'publicar'
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Fijar el canal de actualizaciones
        run: node scripts/set-update-channel.mjs "${CHANNEL}"

      - name: Calcular la huella nativa
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          CI=1 npx expo-updates fingerprint:generate --platform android > "${RUNNER_TEMP}/fingerprint.json"
          node ../../scripts/runtime-info.mjs write "${RUNNER_TEMP}/fingerprint.json" app.json "${RUNNER_TEMP}/runtime-android.json"
          echo "RUNTIME_VERSION=$(node -p 'require(process.argv[1]).runtimeVersion' "${RUNNER_TEMP}/runtime-android.json")" >> "${GITHUB_ENV}"

      - name: Comparar con la huella de la última release
        if: inputs.channel == 'production'
        run: |
          set -euo pipefail
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/runtime-android.json"
          if ! curl -fsSL --retry 3 -o "${RUNNER_TEMP}/published.json" "${URL}"; then
            echo "::error::La última release no publica runtime-android.json. Los APK anteriores a 1.1.8 no reciben OTA."
            exit 1
          fi
          node scripts/runtime-info.mjs check "${RUNNER_TEMP}/runtime-android.json" "${RUNNER_TEMP}/published.json"

      - name: Publicar la actualización
        if: inputs.action == 'publicar'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27.2.0 update --channel "${CHANNEL}" --environment "${CHANNEL}" --platform android --message "${MESSAGE}" --non-interactive

      - name: Volver al código del APK
        if: inputs.action == 'volver-al-apk'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27.2.0 update:roll-back-to-embedded --channel "${CHANNEL}" --runtime-version "${RUNTIME_VERSION}" --platform android --message "${MESSAGE}" --non-interactive

      - name: Resumen
        run: |
          {
            echo "### OTA ${ACTION} en ${CHANNEL}"
            echo "- Huella nativa: \`${RUNTIME_VERSION}\`"
            echo "- Mensaje: ${MESSAGE}"
            echo "- Solo la reciben los APK con esa misma huella (aparece en el resumen del build del APK)."
          } >> "$GITHUB_STEP_SUMMARY"
