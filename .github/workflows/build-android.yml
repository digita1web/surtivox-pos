name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: Decidir si compilar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decidir
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          release=false
          build=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
            build=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            build=true
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build=true
          elif git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | grep -Eq '^(apps/mobile/|packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|\.github/workflows/build-android\.yml$)'; then
            build=true
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "build=${build} release=${release}"

  build-android:
    name: Compilar APK
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_MARKET_PRICES_URL: https://surtivox-market.surtivox.workers.dev/market-prices

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos y tests
        run: |
          bash scripts/verify.sh
          pnpm -r typecheck
          pnpm test

      - name: Check Expo SDK alignment
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Validate Expo module publications
        working-directory: apps/mobile
        run: |
          node -e "const {execFileSync}=require('child_process'); const raw=execFileSync('npx',['expo-modules-autolinking','resolve','--platform','android','--json'],{encoding:'utf8'}); const config=JSON.parse(raw); const missing=config.modules.flatMap((m)=>m.projects.filter((p)=>p.publication&&!p.publication.version).map(()=>m.packageName)); if(missing.length){console.error('Publicaciones Expo sin version: '+missing.join(', ')); process.exit(1);} console.log('Publicaciones Expo OK');"

      - name: Pin Gradle 8.13
        run: sed -i -E 's#gradle-9\.[0-9]+\.[0-9]+-bin\.zip#gradle-8.13-bin.zip#g' apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Increase Gradle memory
        run: |
          if grep -q '^org.gradle.jvmargs=' apps/mobile/android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' apps/mobile/android/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> apps/mobile/android/gradle.properties
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Report APK size
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo '### APK release' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [plan, build-android]
    if: needs.plan.outputs.release == 'true' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-apk
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
