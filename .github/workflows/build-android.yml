name: Build Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_MARKET_PRICES_URL: https://surtivox-market.surtivox.workers.dev/market-prices

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo SDK alignment
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Validate Expo module publications
        working-directory: apps/mobile
        run: |
          node -e "const {execFileSync}=require('child_process'); const raw=execFileSync('npx',['expo-modules-autolinking','resolve','--platform','android','--json'],{encoding:'utf8'}); const config=JSON.parse(raw); const missing=config.modules.flatMap((m)=>m.projects.filter((p)=>p.publication&&!p.publication.version).map(()=>m.packageName)); if(missing.length){console.error('Publicaciones Expo sin version: '+missing.join(', ')); process.exit(1);} console.log('Publicaciones Expo OK');"

      - name: Pin Gradle 8.13
        run: sed -i -E 's#gradle-9\.[0-9]+\.[0-9]+-bin\.zip#gradle-8.13-bin.zip#g' apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Increase Gradle memory
        run: |
          if grep -q '^org.gradle.jvmargs=' apps/mobile/android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' apps/mobile/android/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> apps/mobile/android/gradle.properties
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
