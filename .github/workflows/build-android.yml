name: Build Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      all_archs:
        description: 'Compilar arm64-v8a y armeabi-v7a, como en un release (sin publicar nada)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  plan:
    name: Decidir si compilar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decidir
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          release=false
          build=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            release=true
            build=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            build=true
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            build=true
          elif git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | grep -Eq '^(apps/mobile/|packages/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|package\.json$|scripts/patch-android-signing\.mjs$|\.github/workflows/build-android\.yml$)'; then
            build=true
          fi
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"
          echo "build=${build} release=${release}"

  build-android:
    name: Compilar APK
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_MARKET_PRICES_URL: https://surtivox-market.surtivox.workers.dev/market-prices

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Validar que la etiqueta coincide con app.json
        if: github.ref_type == 'tag'
        run: node scripts/check-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos y tests
        run: |
          bash scripts/verify.sh
          pnpm -r typecheck
          pnpm test

      - name: Check Expo SDK alignment
        working-directory: apps/mobile
        run: npx expo install --check

      - name: Fijar el canal de actualizaciones
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            CHANNEL=production
          else
            CHANNEL=preview
          fi
          node scripts/set-update-channel.mjs "${CHANNEL}"
          echo "UPDATE_CHANNEL=${CHANNEL}" >> "${GITHUB_ENV}"

      - name: Calcular la huella nativa
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          CI=1 npx expo-updates fingerprint:generate --platform android > "${RUNNER_TEMP}/fingerprint.json"
          node ../../scripts/runtime-info.mjs write "${RUNNER_TEMP}/fingerprint.json" app.json "${RUNNER_TEMP}/runtime-android.json"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$(node -p 'require(process.argv[1]).runtimeVersion' "${RUNNER_TEMP}/runtime-android.json")" >> "${GITHUB_ENV}"

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android

      - name: Validate Expo module publications
        working-directory: apps/mobile
        run: |
          node -e "const {execFileSync}=require('child_process'); const raw=execFileSync('npx',['expo-modules-autolinking','resolve','--platform','android','--json'],{encoding:'utf8'}); const config=JSON.parse(raw); const missing=config.modules.flatMap((m)=>m.projects.filter((p)=>p.publication&&!p.publication.version).map(()=>m.packageName)); if(missing.length){console.error('Publicaciones Expo sin version: '+missing.join(', ')); process.exit(1);} console.log('Publicaciones Expo OK');"

      - name: Configurar firma de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secreto ANDROID_${name} en GitHub Actions. No se compila un APK sin la llave de produccion."
              exit 1
            fi
          done
          KEYSTORE_FILE="${RUNNER_TEMP}/surtivox-upload.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_FILE}"
          chmod 600 "${KEYSTORE_FILE}"
          if ! keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEY_ALIAS}" > "${RUNNER_TEMP}/keytool.txt" 2>&1; then
            echo "::error::La llave no abre con los secretos cargados (contrasena, alias o base64 incorrectos)"
            sed 's/^/keytool: /' "${RUNNER_TEMP}/keytool.txt" | grep -v -i 'password' || true
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=${KEYSTORE_FILE}" >> "${GITHUB_ENV}"
          node scripts/patch-android-signing.mjs apps/mobile/android/app/build.gradle
          if ! grep -q 'ANDROID_KEYSTORE_PATH' apps/mobile/android/app/build.gradle; then
            echo "::error::El parche no quedo aplicado en build.gradle"
            exit 1
          fi

      - name: Pin Gradle 8.13
        run: sed -i -E 's#gradle-9\.[0-9]+\.[0-9]+-bin\.zip#gradle-8.13-bin.zip#g' apps/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Increase Gradle memory
        run: |
          if grep -q '^org.gradle.jvmargs=' apps/mobile/android/gradle.properties; then
            sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g/' apps/mobile/android/gradle.properties
          else
            echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> apps/mobile/android/gradle.properties
          fi

      - name: Elegir arquitecturas
        env:
          ALL_ARCHS: ${{ inputs.all_archs }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${ALL_ARCHS}" = "true" ]; then
            echo "ARCHS=arm64-v8a,armeabi-v7a" >> "${GITHUB_ENV}"
            echo "EXPECTED_ABIS='arm64-v8a' 'armeabi-v7a'" >> "${GITHUB_ENV}"
          else
            echo "ARCHS=arm64-v8a" >> "${GITHUB_ENV}"
            echo "EXPECTED_ABIS='arm64-v8a'" >> "${GITHUB_ENV}"
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Arquitecturas: ${ARCHS}"
          ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures="${ARCHS}"

      - name: Verificar las arquitecturas del APK
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          AAPT2=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 | sort -V | tail -n 1)
          ACTUAL=$("${AAPT2}" dump badging "${APK}" | grep -m1 '^native-code:' | sed 's/^native-code: //')
          echo "Arquitecturas del APK: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED_ABIS}" ]; then
            echo "::error::Se esperaba ${EXPECTED_ABIS} y el APK trae ${ACTUAL}"
            exit 1
          fi
          echo '### Arquitecturas del APK' >> "$GITHUB_STEP_SUMMARY"
          echo "${ACTUAL}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar la firma del APK
        env:
          EXPECTED_SHA256: E798F4A4EA18EF4671068FE8C8C3179E2A4F61F0F15D153EA9B1248A6B1CC32D
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee "${RUNNER_TEMP}/apk-certs.txt"
          if grep -qi 'Android Debug' "${RUNNER_TEMP}/apk-certs.txt"; then
            echo "::error::El APK quedo firmado con la llave debug"
            exit 1
          fi
          ACTUAL=$(grep -m1 'certificate SHA-256 digest' "${RUNNER_TEMP}/apk-certs.txt" | awk '{print $NF}' | tr 'a-f' 'A-F' || true)
          if [ -z "${ACTUAL}" ]; then
            echo "::error::apksigner no devolvio la huella del certificado"
            exit 1
          fi
          if [ "${ACTUAL}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::La huella del certificado (${ACTUAL}) no es la de la llave de produccion (${EXPECTED_SHA256})"
            exit 1
          fi
          echo '### Firma del APK' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'certificate (DN|SHA-256 digest)' "${RUNNER_TEMP}/apk-certs.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnosticar si la compilación cambió las fuentes de la huella
        working-directory: apps/mobile
        run: |
          set -uo pipefail
          if ! CI=1 npx expo-updates fingerprint:generate --platform android > "${RUNNER_TEMP}/fingerprint-after.json"; then
            echo "::warning::No se pudo recalcular la huella después de compilar"
            exit 0
          fi
          node -e '
            const [before, after] = process.argv.slice(1).map((f) => require(f));
            if (before.hash === after.hash) { console.log(`La compilación no cambió la huella (${before.hash})`); process.exit(0); }
            const key = (s) => `${s.type} ${s.filePath ?? s.id ?? ""}`;
            const index = (fp) => new Map(fp.sources.map((s) => [key(s), s.hash]));
            const a = index(before), b = index(after);
            const changed = [...new Set([...a.keys(), ...b.keys()])].filter((k) => a.get(k) !== b.get(k));
            console.log(`::warning::La compilación cambió las fuentes de la huella (${before.hash} → ${after.hash}). El APK lleva la de antes por EXPO_UPDATES_FINGERPRINT_OVERRIDE.`);
            for (const k of changed) console.log(`  ${k}: ${a.get(k) ?? "(no estaba)"} → ${b.get(k) ?? "(ya no está)"}`);
          ' "${RUNNER_TEMP}/fingerprint.json" "${RUNNER_TEMP}/fingerprint-after.json" || echo "::warning::No se pudo comparar la huella"

      - name: Verificar la huella y el canal dentro del APK
        run: |
          set -euo pipefail
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          INFO="${RUNNER_TEMP}/runtime-android.json"
          EXPECTED=$(node -p 'require(process.argv[1]).runtimeVersion' "${INFO}")
          EMBEDDED=$(unzip -p "${APK}" assets/fingerprint)
          CHANNEL=$(unzip -p "${APK}" assets/app.config | node -e 'let d="";process.stdin.on("data",(c)=>d+=c).on("end",()=>console.log(JSON.parse(d).updates?.requestHeaders?.["expo-channel-name"]??""))')
          if [ "${EMBEDDED}" != "${EXPECTED}" ]; then
            echo "::error::La huella dentro del APK (${EMBEDDED}) no es la calculada (${EXPECTED}). Las OTA no llegarían a este APK."
            exit 1
          fi
          if [ "${CHANNEL}" != "${UPDATE_CHANNEL}" ]; then
            echo "::error::El APK escucha el canal '${CHANNEL}' y se esperaba '${UPDATE_CHANNEL}'"
            exit 1
          fi
          echo '### Actualizaciones OTA' >> "$GITHUB_STEP_SUMMARY"
          echo "Canal \`${CHANNEL}\`, huella nativa \`${EMBEDDED}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Report APK size
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          echo '### APK release' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Subir la huella como artefacto
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-android
          path: ${{ runner.temp }}/runtime-android.json
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [plan, build-android]
    if: needs.plan.outputs.release == 'true' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-apk
          path: release-apk

      - name: Descargar la huella
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-android
          path: release-apk

      - name: Exigir el canal production en la huella de la release
        run: |
          set -euo pipefail
          CHANNEL=$(node -p 'require(process.argv[1]).channel' release-apk/runtime-android.json)
          if [ "${CHANNEL}" != "production" ]; then
            echo "::error::La release solo publica APK del canal production (llegó '${CHANNEL}')"
            exit 1
          fi

      - name: Renombrar el APK de la release
        run: mv release-apk/app-release.apk release-apk/Surtivox.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-apk/Surtivox.apk
            release-apk/runtime-android.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
