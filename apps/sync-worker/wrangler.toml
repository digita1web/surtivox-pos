name = "surtivox-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# The D1 database. Create it with `pnpm db:create`, then paste the printed
# database_id below before deploying.
[[d1_databases]]
binding = "DB"
database_name = "surtivox-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[observability]
enabled = true
