name = "surtivox-catalogo"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

[vars]
CATALOG_MIN_CONTRIBUTORS = "2"

[[d1_databases]]
binding = "DB"
database_name = "surtivox-catalog"
database_id = "REPLACE_WITH_DATABASE_ID"

[observability]
enabled = true

[triggers]
crons = ["17 3 * * *"]
